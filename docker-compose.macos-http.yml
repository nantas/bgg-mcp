services:
  bgg-mcp:
    build:
      context: .
    image: bgg-mcp:macos-http
    command: ["-mode", "http", "-port", "8080"]
    ports:
      - "8080:8080"
    env_file:
      - ./docker-compose.macos-http.env
    environment:
      MCP_BASE_URL: ${MCP_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/.well-known/mcp-config >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
